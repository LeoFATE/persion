<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMS - 新增员工</title>
  <!-- Vue 2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <!-- axios for ajax -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; padding: 20px; }
    .form-field { margin-bottom: 12px; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    input, select { padding:8px; width:300px; }
    .error { color: #b00020; }
    .success { color: #0a7a07; }
  </style>
</head>
<body>
  <div id="app">
    <h1>新增员工 (t_emp)</h1>

    <div v-if="message" :class="{'success': success, 'error': !success}">{{ message }}</div>

    <div class="form-field">
      <label for="e_name">姓名 (e_name)</label>
      <input id="e_name" v-model="form.e_name" placeholder="请输入姓名" />
    </div>

    <div class="form-field">
      <label for="e_hire_date">入职日期 (e_hire_date) <span class="error">*</span></label>
      <input id="e_hire_date" type="date" v-model="form.e_hire_date" />
    </div>

    <div class="form-field">
      <label for="e_d_id">部门 (e_d_id)</label>
      <select id="e_d_id" v-model="form.e_d_id">
        <option disabled value="">-- 请选择部门 --</option>
        <option value="none">无部门</option>
        <option v-for="(name, id) in deptMap" :key="id" :value="id">{{ name }}</option>
      </select>
    </div>

    <div class="form-field">
      <label for="e_sex">性别 (e_sex)</label>
      <select id="e_sex" v-model="form.e_sex">
        <option value="">-- 请选择 --</option>
        <option value="1">男</option>
        <option value="0">女</option>
      </select>
    </div>

    <button @click="submit">提交</button>
    <button @click="reset" style="margin-left:8px">重置</button>
    <button @click="viewList" style="margin-left:8px">查看</button>
  </div>

  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          form: {
            e_name: '',
            e_hire_date: '',
            e_d_id: '',
            e_sex: ''
          },
          message: '',
          success: false,
          deptMap: {}
        }
      },
      created() {
        // load dept mapping
        axios.get('/api/emps/depts').then(res => { this.deptMap = res.data || {}; }).catch(err => { console.error('load depts failed', err); });
      },
      methods: {
        validate() {
          if (!this.form.e_hire_date) {
            this.message = '入职日期 (e_hire_date) 为必填项';
            this.success = false;
            return false;
          }
          // e_name 可选，但若用户填写则应去除左右空格
          if (this.form.e_name) this.form.e_name = this.form.e_name.trim();
          return true;
        },
        async submit() {
          this.message = '';
          if (!this.validate()) return;

          // 构建 payload
          const payload = {
            e_name: this.form.e_name,
            e_hire_date: this.form.e_hire_date,
            e_d_id: (this.form.e_d_id && this.form.e_d_id !== 'none') ? Number(this.form.e_d_id) : null,
            e_sex: this.form.e_sex || null
          };

          try {
            const res = await axios.post('/api/emps', payload);
            if (res.status === 201) {
              this.message = '提交成功';
              this.success = true;
              this.reset(false);
            } else {
              this.message = '服务器返回: ' + JSON.stringify(res.data);
              this.success = false;
            }
          } catch (err) {
            console.error(err);
            if (err.response && err.response.data) {
              this.message = '错误: ' + JSON.stringify(err.response.data);
            } else {
              this.message = '网络或服务器错误: ' + err.message;
            }
            this.success = false;
          }
        },
        reset(clearMessage = true) {
          this.form.e_name = '';
          this.form.e_hire_date = '';
          this.form.e_d_id = '';
          this.form.e_sex = '';
          if (clearMessage) { this.message = ''; this.success = false; }
        },
        viewList() {
          // 打开查看页面
          window.location.href = '/emps.html';
        }
      }
    });
  </script>
</body>
</html>
